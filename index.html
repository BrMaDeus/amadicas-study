<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amadicas Study</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="authScreen" hidden></div>
  <div id="app">

    <!-- BOTÃO DA SIDEBAR -->
    <button
      class="sidebar-toggle"
      id="sidebarToggle"
      type="button"
      onclick="toggleSidebar()"
      aria-label="Abrir ou fechar menu"
      aria-expanded="true"
      title="Abrir ou fechar menu"
    >
      ☰
    </button>


    <!-- SIDEBAR -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-mark">A</div>

        <div>
          <strong>Amadicas</strong>
          <span>Study</span>
        </div>
      </div>


      <nav class="sidebar-nav">

        <div class="nav-section-title">
          ESTUDO
        </div>


        <button
          class="nav-item active"
          data-page="dashboard"
        >
          <span>⌂</span>
          Dashboard
        </button>


        <button
          class="nav-item"
          data-page="revisoes"
        >
          <span>✓</span>
          Revisões
        </button>


        <button
          class="nav-item"
          data-page="assuntos"
        >
          <span>▦</span>
          Assuntos
        </button>


        <button
          class="nav-item"
          data-page="simulados"
        >
          <span>▤</span>
          Provas e simulados
        </button>


        <button
          class="nav-item"
          data-page="calendario"
        >
          <span>□</span>
          Calendário
        </button>

      </nav>


      <div class="sidebar-bottom">

        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Alternar tema"
          title="Alternar tema"
        >
          <span class="theme-toggle-icon">☾</span>
          <span class="theme-toggle-text">Modo escuro</span>
        </button>


        <button
          class="side-action"
          onclick="exportData()"
        >
          ⇩ Exportar dados
        </button>


        <label class="side-action import-label">

          ⇧ Importar dados

          <input
            type="file"
            id="importFile"
            accept=".json"
            onchange="importData(event)"
          >

        </label>


        <button
          class="side-action danger"
          onclick="resetData()"
        >
          ↻ Resetar dados
        </button>

      </div>

    </aside>


    <!-- MAIN -->
    <main class="main">

      <header class="mobile-header">

        <div class="brand">

          <div class="brand-mark">
            A
          </div>

          <div>
            <strong>Amadicas</strong>
            <span>Study</span>
          </div>

        </div>


        <button
          class="theme-toggle mobile-theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Alternar tema"
          title="Alternar tema"
        >
          <span class="theme-toggle-icon">☾</span>
        </button>

      </header>


      <div id="pageContent"></div>

    </main>

  </div>


  <!-- MODAIS -->
  <div id="modalRoot"></div>


  <!-- =====================================================
       AMADICAS STUDY V2.0
       JAVASCRIPT
       ===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/sidebar.js"></script>
<script src="js/navigation.js"></script>
<script src="js/reviews.js"></script>
<script src="js/subjects.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/tests.js"></script>
<script src="js/calendar.js"></script>
<script src="js/app.js"></script>

</body>
</html>
